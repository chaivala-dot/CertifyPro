services:
  postgres:
    image: postgres:16
    container_name: certifypro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certifypro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d certifypro" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - certifypro_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certifypro-backend
    restart: unless-stopped
    ports:
      - "5000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/certifypro
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-32-char-secret-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - certifypro_internal

networks:
  certifypro_internal:
    driver: bridge

volumes:
  postgres_data:
